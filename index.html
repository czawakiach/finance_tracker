<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Portfolio Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Recharts dependencies -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.5.0/dist/Recharts.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { PieChart, Pie, Cell, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;

        const CATEGORIES = ['Bonds', 'Stocks', 'ETFs', 'Speculative', 'Gold & Silver', 'Cash', 'Real Estate'];
        const COLORS = ['#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#eab308', '#6366f1', '#ec4899'];
        const BASE_CURRENCY = 'PLN';

        // Icon Components
        const Plus = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>;
        const Trash2 = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
        const Download = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>;
        const Upload = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
        const TrendingUp = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>;
        const TrendingDown = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" /></svg>;
        const Target = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;

        function FinanceTracker() {
          const [activeTab, setActiveTab] = useState('personal');
          const [viewMode, setViewMode] = useState('current');
          const [exchangeRates, setExchangeRates] = useState({
            PLN: 1,
            USD: 4.0,
            EUR: 4.3,
            GBP: 5.0,
            NOK: 0.38
          });
          const [showRatesModal, setShowRatesModal] = useState(false);
          
          const [portfolios, setPortfolios] = useState({
            personal: {
              holdings: {},
              targets: {},
              snapshots: []
            },
            retirement: {
              holdings: {},
              targets: {},
              snapshots: []
            }
          });

          useEffect(() => {
            const saved = localStorage.getItem('financeTrackerData');
            if (saved) {
              setPortfolios(JSON.parse(saved));
            }
            
            const savedRates = localStorage.getItem('exchangeRates');
            if (savedRates) {
              setExchangeRates(JSON.parse(savedRates));
            }
          }, []);

          useEffect(() => {
            localStorage.setItem('financeTrackerData', JSON.stringify(portfolios));
          }, [portfolios]);

          useEffect(() => {
            localStorage.setItem('exchangeRates', JSON.stringify(exchangeRates));
          }, [exchangeRates]);

          const updateExchangeRate = (currency, rate) => {
            setExchangeRates({
              ...exchangeRates,
              [currency]: parseFloat(rate) || 0
            });
          };

          const addHolding = (portfolio, category) => {
            const newHoldings = { ...portfolios[portfolio].holdings };
            if (!newHoldings[category]) {
              newHoldings[category] = [];
            }
            newHoldings[category].push({
              id: Date.now(),
              name: '',
              quantity: 0,
              price: 0,
              currency: BASE_CURRENCY
            });
            
            setPortfolios({
              ...portfolios,
              [portfolio]: {
                ...portfolios[portfolio],
                holdings: newHoldings
              }
            });
          };

          const updateHolding = (portfolio, category, holdingId, field, value) => {
            const newHoldings = { ...portfolios[portfolio].holdings };
            const holding = newHoldings[category].find(h => h.id === holdingId);
            if (holding) {
              holding[field] = value;
              setPortfolios({
                ...portfolios,
                [portfolio]: {
                  ...portfolios[portfolio],
                  holdings: newHoldings
                }
              });
            }
          };

          const deleteHolding = (portfolio, category, holdingId) => {
            const newHoldings = { ...portfolios[portfolio].holdings };
            newHoldings[category] = newHoldings[category].filter(h => h.id !== holdingId);
            setPortfolios({
              ...portfolios,
              [portfolio]: {
                ...portfolios[portfolio],
                holdings: newHoldings
              }
            });
          };

          const updateTarget = (portfolio, category, value) => {
            setPortfolios({
              ...portfolios,
              [portfolio]: {
                ...portfolios[portfolio],
                targets: {
                  ...portfolios[portfolio].targets,
                  [category]: parseFloat(value) || 0
                }
              }
            });
          };

          const calculateHoldingValue = (holding) => {
            const rate = exchangeRates[holding.currency] || 1;
            return holding.quantity * holding.price * rate;
          };

          const calculateCategoryTotal = (portfolio, category) => {
            const holdings = portfolios[portfolio].holdings[category] || [];
            return holdings.reduce((sum, h) => sum + calculateHoldingValue(h), 0);
          };

          const calculatePortfolioTotal = (portfolio) => {
            return CATEGORIES.reduce((sum, cat) => sum + calculateCategoryTotal(portfolio, cat), 0);
          };

          const getAllocationData = (portfolio) => {
            const total = calculatePortfolioTotal(portfolio);
            if (total === 0) return [];
            
            return CATEGORIES.map(category => ({
              name: category,
              value: calculateCategoryTotal(portfolio, category),
              percentage: (calculateCategoryTotal(portfolio, category) / total * 100).toFixed(1),
              target: portfolios[portfolio].targets[category] || 0
            })).filter(d => d.value > 0);
          };

          const saveSnapshot = (portfolio) => {
            const currentDate = new Date();
            const snapshot = {
              date: currentDate.toISOString(),
              holdings: JSON.parse(JSON.stringify(portfolios[portfolio].holdings)),
              total: calculatePortfolioTotal(portfolio),
              allocations: getAllocationData(portfolio)
            };
            
            const newSnapshots = [...portfolios[portfolio].snapshots, snapshot];
            
            setPortfolios({
              ...portfolios,
              [portfolio]: {
                ...portfolios[portfolio],
                snapshots: newSnapshots
              }
            });
            
            alert(`Snapshot saved successfully for ${new Date().toLocaleDateString('pl-PL')}!`);
          };

          const getHistoricalData = (portfolio) => {
            return portfolios[portfolio].snapshots.map(s => ({
              date: new Date(s.date).toLocaleDateString('pl-PL', { month: 'short', year: 'numeric' }),
              total: s.total
            }));
          };

          const getPerformanceMetrics = (portfolio) => {
            const snapshots = portfolios[portfolio].snapshots;
            const current = calculatePortfolioTotal(portfolio);
            
            if (snapshots.length === 0) return { mom: 0, ytd: 0 };
            
            const lastMonth = snapshots[snapshots.length - 1].total;
            const mom = ((current - lastMonth) / lastMonth * 100).toFixed(2);
            
            const currentYear = new Date().getFullYear();
            const yearStart = snapshots.find(s => new Date(s.date).getFullYear() === currentYear);
            const ytd = yearStart ? ((current - yearStart.total) / yearStart.total * 100).toFixed(2) : 0;
            
            return { mom: parseFloat(mom), ytd: parseFloat(ytd) };
          };

          const exportToCSV = () => {
            const data = JSON.stringify(portfolios, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `finance-tracker-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          };

          const importFromCSV = (event) => {
            const file = event.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (e) => {
                try {
                  const imported = JSON.parse(e.target.result);
                  setPortfolios(imported);
                  alert('Data imported successfully!');
                } catch (error) {
                  alert('Invalid file format');
                }
              };
              reader.readAsText(file);
            }
          };

          const getCombinedSummary = () => {
            const personalTotal = calculatePortfolioTotal('personal');
            const retirementTotal = calculatePortfolioTotal('retirement');
            const total = personalTotal + retirementTotal;
            
            const combinedAllocations = CATEGORIES.map(category => {
              const personalValue = calculateCategoryTotal('personal', category);
              const retirementValue = calculateCategoryTotal('retirement', category);
              const totalValue = personalValue + retirementValue;
              
              return {
                name: category,
                value: totalValue,
                percentage: total > 0 ? (totalValue / total * 100).toFixed(1) : 0,
                personal: personalValue,
                retirement: retirementValue
              };
            }).filter(d => d.value > 0);
            
            return {
              total,
              personalTotal,
              retirementTotal,
              allocations: combinedAllocations
            };
          };

          const renderCurrentView = () => {
            const portfolio = activeTab;
            const total = calculatePortfolioTotal(portfolio);
            const allocationData = getAllocationData(portfolio);
            const metrics = getPerformanceMetrics(portfolio);

            return (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-white p-6 rounded-lg shadow">
                    <div className="text-sm text-gray-500">Total Value</div>
                    <div className="text-2xl font-bold">{total.toLocaleString('pl-PL', { minimumFractionDigits: 2 })} {BASE_CURRENCY}</div>
                  </div>
                  <div className="bg-white p-6 rounded-lg shadow">
                    <div className="text-sm text-gray-500 flex items-center gap-2">
                      Month over Month
                      {metrics.mom >= 0 ? <TrendingUp className="w-4 h-4 text-green-600" /> : <TrendingDown className="w-4 h-4 text-red-600" />}
                    </div>
                    <div className={`text-2xl font-bold ${metrics.mom >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                      {metrics.mom > 0 ? '+' : ''}{metrics.mom}%
                    </div>
                  </div>
                  <div className="bg-white p-6 rounded-lg shadow">
                    <div className="text-sm text-gray-500">Year to Date</div>
                    <div className={`text-2xl font-bold ${metrics.ytd >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                      {metrics.ytd > 0 ? '+' : ''}{metrics.ytd}%
                    </div>
                  </div>
                </div>

                <div className="bg-blue-50 p-4 rounded-lg">
                  <div className="flex justify-between items-center">
                    <div className="text-sm font-medium">Exchange Rates to PLN</div>
                    <button
                      onClick={() => setShowRatesModal(true)}
                      className="px-3 py-1 bg-blue-600 text-white rounded text-sm hover:bg-blue-700"
                    >
                      Edit Rates
                    </button>
                  </div>
                  <div className="flex gap-4 mt-2 text-sm text-gray-700">
                    <span>USD: {exchangeRates.USD}</span>
                    <span>EUR: {exchangeRates.EUR}</span>
                    <span>GBP: {exchangeRates.GBP}</span>
                    <span>NOK: {exchangeRates.NOK}</span>
                  </div>
                </div>

                <div className="space-y-4">
                  {CATEGORIES.map((category, idx) => (
                    <div key={category} className="bg-white p-6 rounded-lg shadow">
                      <div className="flex justify-between items-center mb-4">
                        <div className="flex items-center gap-4 flex-wrap">
                          <h3 className="text-lg font-semibold">{category}</h3>
                          <div className="text-sm text-gray-500">
                            Total: {calculateCategoryTotal(portfolio, category).toLocaleString('pl-PL', { minimumFractionDigits: 2 })} {BASE_CURRENCY}
                            {total > 0 && (
                              <span className="ml-2">
                                ({(calculateCategoryTotal(portfolio, category) / total * 100).toFixed(1)}%)
                              </span>
                            )}
                          </div>
                          {portfolios[portfolio].targets[category] > 0 && (
                            <div className="flex items-center gap-1 text-sm text-purple-600">
                              <Target className="w-4 h-4" />
                              Target: {portfolios[portfolio].targets[category]}%
                            </div>
                          )}
                        </div>
                        <div className="flex gap-2">
                          <input
                            type="number"
                            placeholder="Target %"
                            value={portfolios[portfolio].targets[category] || ''}
                            onChange={(e) => updateTarget(portfolio, category, e.target.value)}
                            className="w-24 px-2 py-1 border rounded text-sm"
                          />
                          <button
                            onClick={() => addHolding(portfolio, category)}
                            className="p-2 bg-green-600 text-white rounded hover:bg-green-700"
                          >
                            <Plus />
                          </button>
                        </div>
                      </div>

                      {portfolios[portfolio].holdings[category]?.map(holding => (
                        <div key={holding.id} className="grid grid-cols-1 md:grid-cols-5 gap-2 mb-2">
                          <input
                            type="text"
                            placeholder="Asset name"
                            value={holding.name}
                            onChange={(e) => updateHolding(portfolio, category, holding.id, 'name', e.target.value)}
                            className="px-3 py-2 border rounded"
                          />
                          <input
                            type="number"
                            placeholder="Quantity"
                            value={holding.quantity || ''}
                            onChange={(e) => updateHolding(portfolio, category, holding.id, 'quantity', parseFloat(e.target.value) || 0)}
                            className="px-3 py-2 border rounded"
                          />
                          <input
                            type="number"
                            placeholder="Price"
                            value={holding.price || ''}
                            onChange={(e) => updateHolding(portfolio, category, holding.id, 'price', parseFloat(e.target.value) || 0)}
                            className="px-3 py-2 border rounded"
                          />
                          <select
                            value={holding.currency}
                            onChange={(e) => updateHolding(portfolio, category, holding.id, 'currency', e.target.value)}
                            className="px-3 py-2 border rounded"
                          >
                            <option value="PLN">PLN</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="NOK">NOK</option>
                          </select>
                          <div className="flex items-center gap-2">
                            <span className="text-sm font-medium">
                              {calculateHoldingValue(holding).toLocaleString('pl-PL', { minimumFractionDigits: 2 })} PLN
                            </span>
                            <button
                              onClick={() => deleteHolding(portfolio, category, holding.id)}
                              className="p-2 text-red-600 hover:bg-red-50 rounded"
                            >
                              <Trash2 />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>

                {allocationData.length > 0 && (
                  <div className="bg-white p-6 rounded-lg shadow">
                    <h3 className="text-lg font-semibold mb-4">Current Allocation</h3>
                    <ResponsiveContainer width="100%" height={300}>
                      <PieChart>
                        <Pie
                          data={allocationData}
                          cx="50%"
                          cy="50%"
                          labelLine={false}
                          label={({ name, percentage }) => `${name}: ${percentage}%`}
                          outerRadius={100}
                          fill="#8884d8"
                          dataKey="value"
                        >
                          {allocationData.map((entry, index) => (
                            <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                          ))}
                        </Pie>
                        <Tooltip formatter={(value) => `${value.toLocaleString('pl-PL', { minimumFractionDigits: 2 })} PLN`} />
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                )}

                <button
                  onClick={() => saveSnapshot(portfolio)}
                  className="w-full py-3 bg-purple-600 text-white rounded-lg font-semibold hover:bg-purple-700"
                >
                  Save Monthly Snapshot
                </button>
              </div>
            );
          };

          const renderHistoryView = () => {
            const portfolio = activeTab;
            const historicalData = getHistoricalData(portfolio);

            return (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-lg shadow">
                  <h3 className="text-lg font-semibold mb-4">Portfolio Growth Over Time</h3>
                  {historicalData.length > 0 ? (
                    <ResponsiveContainer width="100%" height={400}>
                      <LineChart data={historicalData}>
                        <CartesianGrid strokeDasharray="3 3" />
                        <XAxis dataKey="date" />
                        <YAxis />
                        <Tooltip formatter={(value) => `${value.toLocaleString('pl-PL', { minimumFractionDigits: 2 })} PLN`} />
                        <Legend />
                        <Line type="monotone" dataKey="total" stroke="#8b5cf6" strokeWidth={2} name="Total Value" />
                      </LineChart>
                    </ResponsiveContainer>
                  ) : (
                    <p className="text-gray-500 text-center py-8">No historical data yet. Save your first snapshot to start tracking!</p>
                  )}
                </div>

                <div className="bg-white p-6 rounded-lg shadow">
                  <h3 className="text-lg font-semibold mb-4">Monthly Snapshots</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full">
                      <thead>
                        <tr className="border-b">
                          <th className="text-left py-2">Date</th>
                          <th className="text-right py-2">Total Value</th>
                          <th className="text-right py-2">Change</th>
                        </tr>
                      </thead>
                      <tbody>
                        {portfolios[portfolio].snapshots.map((snapshot, idx) => {
                          const prevTotal = idx > 0 ? portfolios[portfolio].snapshots[idx - 1].total : snapshot.total;
                          const change = ((snapshot.total - prevTotal) / prevTotal * 100).toFixed(2);
                          
                          return (
                            <tr key={idx} className="border-b">
                              <td className="py-2">{new Date(snapshot.date).toLocaleDateString('pl-PL')}</td>
                              <td className="text-right">{snapshot.total.toLocaleString('pl-PL', { minimumFractionDigits: 2 })} PLN</td>
                              <td className={`text-right ${change >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                {idx > 0 ? `${change > 0 ? '+' : ''}${change}%` : '-'}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            );
          };

          const renderSummaryView = () => {
            const summary = getCombinedSummary();

            return (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-gradient-to-br from-purple-600 to-purple-700 text-white p-6 rounded-lg shadow-lg">
                    <div className="text-sm opacity-90">Total Wealth</div>
                    <div className="text-3xl font-bold mt-2">{summary.total.toLocaleString('pl-PL', { minimumFractionDigits: 2 })} {BASE_CURRENCY}</div>
                  </div>
                  <div className="bg-white p-6 rounded-lg shadow">
                    <div className="text-sm text-gray-500">Personal Portfolio</div>
                    <div className="text-2xl font-bold text-blue-600 mt-2">{summary.personalTotal.toLocaleString('pl-PL', { minimumFractionDigits: 2 })} {BASE_CURRENCY}</div>
                    <div className="text-sm text-gray-500 mt-1">
                      {summary.total > 0 ? (summary.personalTotal / summary.total * 100).toFixed(1) : 0}% of total
                    </div>
                  </div>
                  <div className="bg-white p-6 rounded-lg shadow">
                    <div className="text-sm text-gray-500">Retirement Portfolio</div>
                    <div className="text-2xl font-bold text-green-600 mt-2">{summary.retirementTotal.toLocaleString('pl-PL', { minimumFractionDigits: 2 })} {BASE_CURRENCY}</div>
                    <div className="text-sm text-gray-500 mt-1">
                      {summary.total > 0 ? (summary.retirementTotal / summary.total * 100).toFixed(1) : 0}% of total
                    </div>
                  </div>
                </div>

                {summary.allocations.length > 0 && (
                  <div className="bg-white p-6 rounded-lg shadow">
                    <h3 className="text-lg font-semibold mb-4">Combined Asset Allocation</h3>
                    <ResponsiveContainer width="100%" height={350}>
                      <PieChart>
                        <Pie
                          data={summary.allocations}
                          cx="50%"
                          cy="50%"
                          labelLine={false}
                          label={({ name, percentage }) => `${name}: ${percentage}%`}
                          outerRadius={120}
                          fill="#8884d8"
                          dataKey="value"
                        >
                          {summary.allocations.map((entry, index) => (
                            <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                          ))}
                        </Pie>
                        <Tooltip formatter={(value) => `${value.toLocaleString('pl-PL', { minimumFractionDigits: 2 })} PLN`} />
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                )}

                <div className="bg-white p-6 rounded-lg shadow">
                  <h3 className="text-lg font-semibold mb-4">Category Breakdown</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full">
                      <thead>
                        <tr className="border-b">
                          <th className="text-left py-2">Category</th>
                          <th className="text-right py-2">Personal</th>
                          <th className="text-right py-2">Retirement</th>
                          <th className="text-right py-2">Total</th>
                          <th className="text-right py-2">% of Wealth</th>
                        </tr>
                      </thead>
                      <tbody>
                        {summary.allocations.map((alloc, idx) => (
                          <tr key={idx} className="border-b">
                            <td className="py-2 flex items-center gap-2">
                              <div className="w-3 h-3 rounded" style={{ backgroundColor: COLORS[idx % COLORS.length] }}></div>
                              {alloc.name}
                            </td>
                            <td className="text-right">{alloc.personal.toLocaleString('pl-PL', { minimumFractionDigits: 2 })}</td>
                            <td className="text-right">{alloc.retirement.toLocaleString('pl-PL', { minimumFractionDigits: 2 })}</td>
                            <td className="text-right font-semibold">{alloc.value.toLocaleString('pl-PL', { minimumFractionDigits: 2 })}</td>
                            <td className="text-right">{alloc.percentage}%</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            );
          };

          return (
            <div className="min-h-screen bg-gray-50 p-4 md:p-8">
              <div className="max-w-7xl mx-auto">
                <div className="mb-8">
                  <h1 className="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Personal Finance Portfolio Tracker</h1>
                  <p className="text-gray-600">Track your wealth across personal and retirement accounts</p>
                </div>

                <div className="mb-6 flex flex-wrap gap-2">
                  <button
                    onClick={() => setViewMode('current')}
                    className={`px-4 py-2 rounded-lg font-medium ${viewMode === 'current' ? 'bg-purple-600 text-white' : 'bg-white text-gray-700'}`}
                  >
                    Current Holdings
                  </button>
                  <button
                    onClick={() => setViewMode('history')}
                    className={`px-4 py-2 rounded-lg font-medium ${viewMode === 'history' ? 'bg-purple-600 text-white' : 'bg-white text-gray-700'}`}
                  >
                    History
                  </button>
                  <button
                    onClick={() => setViewMode('summary')}
                    className={`px-4 py-2 rounded-lg font-medium ${viewMode === 'summary' ? 'bg-purple-600 text-white' : 'bg-white text-gray-700'}`}
                  >
                    Combined Summary
                  </button>
                  <div className="ml-auto flex gap-2">
                    <button
                      onClick={exportToCSV}
                      className="px-4 py-2 bg-blue-600 text-white rounded-lg flex items-center gap-2 hover:bg-blue-700"
                    >
                      <Download /> Export
                    </button>
                    <label className="px-4 py-2 bg-green-600 text-white rounded-lg flex items-center gap-2 hover:bg-green-700 cursor-pointer">
                      <Upload /> Import
                      <input type="file" accept=".json" onChange={importFromCSV} className="hidden" />
                    </label>
                  </div>
                </div>

                {viewMode !== 'summary' && (
                  <div className="mb-6 flex flex-wrap gap-2">
                    <button
                      onClick={() => setActiveTab('personal')}
                      className={`px-6 py-3 rounded-lg font-medium ${activeTab === 'personal' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700'}`}
                    >
                      Personal Portfolio
                    </button>
                    <button
                      onClick={() => setActiveTab('retirement')}
                      className={`px-6 py-3 rounded-lg font-medium ${activeTab === 'retirement' ? 'bg-green-600 text-white' : 'bg-white text-gray-700'}`}
                    >
                      Retirement Portfolio
                    </button>
                  </div>
                )}

                {viewMode === 'current' && renderCurrentView()}
                {viewMode === 'history' && renderHistoryView()}
                {viewMode === 'summary' && renderSummaryView()}

                {showRatesModal && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg p-6 max-w-md w-full">
                      <h3 className="text-xl font-semibold mb-4">Edit Exchange Rates</h3>
                      <p className="text-sm text-gray-600 mb-4">Enter how many PLN equals 1 unit of each currency</p>
                      
                      <div className="space-y-3">
                        {['USD', 'EUR', 'GBP', 'NOK'].map(currency => (
                          <div key={currency} className="flex items-center gap-3">
                            <label className="w-16 font-medium">{currency}:</label>
                            <input
                              type="number"
                              step="0.01"
                              value={exchangeRates[currency] || ''}
                              onChange={(e) => updateExchangeRate(currency, e.target.value)}
                              className="flex-1 px-3 py-2 border rounded"
                            />
                            <span className="text-gray-600">PLN</span>
                          </div>
                        ))}
                      </div>

                      <div className="flex gap-2 mt-6">
                        <button
                          onClick={() => setShowRatesModal(false)}
                          className="flex-1 px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300"
                        >
                          Close
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        ReactDOM.render(<FinanceTracker />, document.getElementById('root'));
    </script>
</body>
</html>
